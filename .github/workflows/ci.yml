name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  licences:
    name: Licences (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  schemas:
    name: Schemas and objects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: "Every opo:: attribute validates against schema/0.1"
        run: python3 tools/validate_schemas.py .
      - name: "Class templates build and check"
        run: python3 tools/check_opo.py .

  conformance:
    name: Conformance suite (prototypes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: "FEEL interpreter self-test"
        run: python3 tools/feel.py
      - name: "Conformance cases"
        run: python3 tools/run_conformance.py .

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments=false './**/*.md'
          fail: true

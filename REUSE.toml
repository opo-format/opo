version = 1

# Default: specification and documentation text
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "OPO format contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Schemas, conformance suite and tools
[[annotations]]
path = ["schema/**", "conformance/**", "tools/**", ".github/**", "REUSE.toml", ".gitignore"]
precedence = "override"
SPDX-FileCopyrightText = "OPO format contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Fixture objects of the conformance suite (frozen copies of the prototype door and templates)
[[annotations]]
path = ["conformance/fixtures/**"]
precedence = "override"
SPDX-FileCopyrightText = "OPO format contributors"
SPDX-License-Identifier = "CC0-1.0"
